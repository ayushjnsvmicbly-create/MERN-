<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-areas:
                "head head"
                "side main"
                "foot foot";
            gap: 16px;
        }

        .grid-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 24px;
            background-color: #dbeafe;
        }

        .head {
            grid-area: head;
        }

        .side {
            grid-area: side;
        }

        .main {
            grid-area: main;
        }

        .foot {
            grid-area: foot;
        }
    </style>
</head>
<body>
    <div class="grid">
        <header class="grid-item head">
            <span aria-hidden="true">⌂</span>
            <h1>CSS Grid</h1>
        </header>
        <aside class="grid-item side">
            <span aria-hidden="true">☰</span>
            <span>Side</span>
        </aside>
        <main class="grid-item main">
            <span aria-hidden="true">▣</span>
            <span>Main content</span>
        </main>
        <footer class="grid-item foot">
            <span aria-hidden="true">©</span>
            <span>Footer</span>
        </footer>
    </div>
</body>
</html>
