<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <h1>Create an Account</h1>
        <form>
            <p>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </p>
            <p>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </p>
            <p>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </p>
            <p>
                <label for="date">Date of birth</label>
                <input type="date" id="date" name="date">
            </p>
            <p>
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel">
            </p>

            <fieldset>
                <legend>Preferred contact method</legend>
                <label for="contact-email">
                    <input type="radio" id="contact-email" name="contact-method" value="email" required>
                    Email
                </label>
                <label for="contact-phone">
                    <input type="radio" id="contact-phone" name="contact-method" value="phone">
                    Phone
                </label>
            </fieldset>

            <fieldset>
                <legend>Interests</legend>
                <label for="interest-web">
                    <input type="checkbox" id="interest-web" name="interests" value="web-development">
                    Web development
                </label>
                <label for="interest-design">
                    <input type="checkbox" id="interest-design" name="interests" value="design">
                    Design
                </label>
            </fieldset>

            <p>
                <label for="course">Choose a course</label>
                <select id="course" name="course" required>
                    <option value="">Select a course</option>
                    <option value="B.tech">B.Tech</option>
                    <option value="BCA">BCA</option>
                    <option value="M.tech">M.tech</option>
                </select>
            </p>
            <p>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" cols="40"></textarea>
            </p>
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
