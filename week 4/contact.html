<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact My Website with questions about courses and events.">
    <meta name="theme-color" content="#2563eb">
    <title>Contact | My Website</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body>
    <header>
        <h1>My Website</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="register.html">Register</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Us</h2>
            <p>Have a question about a course or event? Send us a message.</p>
            <form>
                <p>
                    <label for="contact-name">Name</label>
                    <input type="text" id="contact-name" name="name" autocomplete="name" required>
                </p>
                <p>
                    <label for="contact-email-address">Email</label>
                    <input type="email" id="contact-email-address" name="email" autocomplete="email" required>
                </p>
                <p>
                    <label for="contact-message">Message</label>
                    <textarea id="contact-message" name="message" rows="5" cols="40" required></textarea>
                </p>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>
</body>
</html>
