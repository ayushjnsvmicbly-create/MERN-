<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            background: #f3f6fb;
            color: #172033;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(100%, 900px);
            margin: 0 auto;
        }

        header {
            margin-bottom: 32px;
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(30px, 5vw, 42px);
        }

        header p {
            margin: 0;
            color: #586174;
            line-height: 1.6;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .profile-card {
            padding: 28px 24px;
            border: 2px solid var(--card-border);
            border-radius: 20px;
            background: var(--card-background);
            text-align: center;
        }

        .profile-card--blue {
            --card-border: #5273e8;
            --card-background: #eef2ff;
            --accent: #315bea;
        }

        .profile-card--coral {
            --card-border: #e88769;
            --card-background: #fff1eb;
            --accent: #c94f35;
        }

        .avatar {
            display: block;
            width: 112px;
            height: 112px;
            margin: 0 auto 18px;
            border: 4px solid var(--accent);
            border-radius: 50%;
            object-fit: cover;
            object-position: center 35%;
        }

        .profile-card h2 {
            margin: 0 0 6px;
            color: var(--accent);
            font-size: 22px;
        }

        .role {
            margin: 0 0 14px;
            color: #586174;
            font-size: 14px;
            font-weight: 700;
        }

        .bio {
            margin: 0;
            color: #414b5e;
            font-size: 14px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            body {
                padding: 32px 16px;
            }

            .cards {
                grid-template-columns: 1fr;
                gap: 18px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Profile Cards</h1>
            <p>One card design, shown in two different colour styles.</p>
        </header>

        <section class="cards" aria-label="Profile card colour versions">
            <article class="profile-card profile-card--blue">
                <img class="avatar" src="../week%203/ayush-pic.png" alt="Portrait of Ayush">
                <h2>Ayush</h2>
                <p class="role">Web Development Student</p>
                <p class="bio">Learning to build creative, accessible websites with HTML and CSS.</p>
            </article>

            <article class="profile-card profile-card--coral">
                <img class="avatar" src="../week%203/ayush-pic.png" alt="Portrait of Ayush">
                <h2>Ayush</h2>
                <p class="role">Web Development Student</p>
                <p class="bio">Learning to build creative, accessible websites with HTML and CSS.</p>
            </article>
        </section>
    </main>
</body>
</html>
