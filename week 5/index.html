<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <!-- CSS inside style tag -->
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            color: #1e293b;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100%, 560px);
            padding: 40px;
            border: 1px solid #bfdbfe;
            border-radius: 16px;
            background-color: #ffffff;
            box-shadow: 0 16px 40px rgb(30 64 175 / 12%);
        }

        h1 {
            margin: 0 0 12px;
            color: #1d4ed8;
            font-size: clamp(1.75rem, 5vw, 2.5rem);
        }

        p {
            margin: 0;
            color: #475569;
            font-size: 1.125rem;
            line-height: 1.7;
        }

        @media (max-width: 480px) {
            main {
                padding: 28px 24px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Welcome to My Website</h1>
        <p>This is my first styled webpage.</p>
    </main>
</body>
</html>
