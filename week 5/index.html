<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 14px;
            background-color: #eef2ff;
            font-family: Georgia, "Times New Roman", serif;
            color: #1e293b;
        }

        /* Header */
        header {
            background-color: #315bea;
            color: white;
            text-align: center;
            padding: 26px 15px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            font-size: 14px;
        }

        /* Main sections */
        section {
            background-color: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 19px;
            margin: 5px 0 10px;
        }

        /* Events table */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background-color: #315bea;
            color: white;
            text-align: left;
            padding: 10px 7px;
        }

        td {
            padding: 9px 7px;
            border-bottom: 2px solid #e2e8f0;
        }

        /* Registration form */
        .form-group {
            margin-bottom: 6px;
        }

        label {
            display: inline-block;
            width: 38px;
            font-size: 14px;
        }

        input {
            width: 150px;
            padding: 5px;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        button {
            background-color: #315bea;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d45c7;
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            header h1 {
                font-size: 25px;
            }

            section {
                padding: 12px;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Tech Club</h1>
        <p>Learn. Code. Grow.</p>
    </header>

    <main>
        <section>
            <h2>Upcoming Events</h2>

            <table>
                <thead>
                    <tr>
                        <th>Event</th>
                        <th>Date</th>
                        <th>Venue</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>HTML Workshop</td>
                        <td>12 Nov</td>
                        <td>Lab 1</td>
                    </tr>

                    <tr>
                        <td>Hackathon</td>
                        <td>20 Nov</td>
                        <td>Seminar Hall</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <h2>Register</h2>

            <form action="#" method="get">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <button type="submit">Register</button>
            </form>
        </section>
    </main>

</body>
</html>
