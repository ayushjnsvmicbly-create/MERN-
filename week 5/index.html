<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS inside style tag -->
    <style>
        :root {
            --color-page: #f1f5f9;
            --color-text: #334155;
            --color-muted: #475569;
            --color-heading: #1d4ed8;
            --color-border: #bfdbfe;
            --color-card-start: #ffffff;
            --color-card-end: #eff6ff;
            --color-shadow: rgb(30 64 175 / 12%);

            --space-0: 0;
            --space-1: 8px;
            --space-2: 12px;
            --space-3: 16px;
            --space-4: 24px;
            --space-5: 28px;
            --space-6: 40px;
            --space-page-inset: 32px;
            --space-section: 10vh;
            --space-border: 1px;
            --radius-card: 16px;
            --width-card: 560px;
        }

        * {
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            margin: var(--space-0);
            background-color: var(--color-page);
            color: var(--color-text);
            font-size: 16px;
            line-height: 1.7;
        }

        .card {
            padding: var(--space-6);
            border: var(--space-border) solid var(--color-border);
            border-radius: var(--radius-card);
            background-color: var(--color-card-start);
            box-shadow: var(--space-0) var(--space-3) var(--space-6) var(--color-shadow);
            color: var(--color-muted);
        }

        #hero {
            width: min(calc(100% - var(--space-page-inset)), var(--width-card));
            margin: var(--space-section) auto;
            background: linear-gradient(135deg, var(--color-card-start), var(--color-card-end));
            text-align: center;
        }

        h1 {
            margin: var(--space-0) var(--space-0) var(--space-2);
            color: var(--color-heading);
            font-size: clamp(1.75rem, 5vw, 2.5rem);
            font-weight: 700;
            line-height: 1.2;
        }

        p {
            margin: var(--space-0);
            color: var(--color-muted);
            font-size: 1rem;
            line-height: 1.7;
        }

        @media (max-width: 480px) {
            .card {
                padding: var(--space-5) var(--space-4);
            }
        }
    </style>
</head>
<body>
    <main class="card" id="hero">
        <h1>Welcome to My Website</h1>
        <p>This is my first styled webpage.</p>
    </main>
</body>
</html>
